services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    container_name: researchpilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: researchpilot
      POSTGRES_USER: researchpilot
      POSTGRES_PASSWORD: researchpilot

    ports:
      - "5432:5432"

    volumes:
      - researchpilot_postgres_data:/var/lib/postgresql/data

volumes:
  researchpilot_postgres_data:
